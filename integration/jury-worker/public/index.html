<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grace Vision · Wettbewerbskopie</title><link rel="icon" href="assets/unusable.png"><link rel="stylesheet" href="assets/graceways-base.css"><link rel="stylesheet" href="demo.css"></head>
<body><a class="skip" href="#vision">Grace Vision</a><header class="topbar"><a class="brand" href="./"><span class="brand-mark" aria-hidden="true">G</span><span><strong>GraceWays</strong><small data-t="pilot"></small></span></a><label>Sprache / Language <select id="language"><option value="de">Deutsch</option><option value="en">English</option></select></label></header>
<div class="demo-notice" data-t="notice"></div>
<main class="workspace"><aside class="records-panel"><p class="eyebrow" data-t="synthetic"></p><h1 data-t="animals"></h1><label for="search" data-t="search"></label><input id="search" type="search"><label for="collection" data-t="collection"></label><select id="collection"><option value="all" data-t="all"></option><option value="demo">Demo</option></select><div class="records-list"><button class="record-card active" id="animal" type="button"><span class="record-thumb" aria-hidden="true">M</span><span class="record-copy"><strong>Mira</strong><small>DEMO-001 · <span data-t="synthetic"></span></small></span></button></div><p class="muted" data-t="memory"></p></aside>
<section class="editor-panel"><div class="editor-heading"><div><p class="eyebrow">DEMO-001</p><h1 data-t="identity"></h1><p data-t="facts"></p></div><span class="draft-badge" data-t="synthetic"></span></div>
<nav class="record-nav" aria-label="Sections"><a href="#record" data-t="record"></a><a href="#mainImage" data-t="media"></a><a href="#vision" class="current">Grace Vision</a></nav>
<section class="form-card record-summary" id="record"><div><h2 data-t="main"></h2><p id="mainEmpty" data-t="empty"></p><img id="mainImage" hidden alt=""><p id="mainHash" class="hash"></p></div><div><p data-t="intro"></p><p class="muted" data-t="privacy"></p></div></section>
<section class="vision-card" id="vision" aria-labelledby="visionTitle"><div class="vision-heading"><div><p class="eyebrow">OPENCV AI COMPETITION 2026</p><h2 id="visionTitle">Grace Vision</h2></div><span class="mode-badge" data-t="mock"></span></div><p id="runtime" role="status"></p><p class="mock-note" data-t="mockNote"></p>
<div class="controls"><label><span data-t="mode"></span><select id="mode"><option value="mock" data-t="mock"></option><option value="aws" hidden disabled data-t="aws"></option></select></label><label><span data-t="errorMode"></span><select id="failure"><option value="none" data-t="none"></option><option value="upload" data-t="upload"></option><option value="analysis" data-t="analysis"></option><option value="expired" data-t="expired"></option></select></label></div>
<div id="turnstile" hidden></div><p id="awsNotice" hidden data-t="awsDisabled"></p><fieldset id="samples"><legend data-t="sample"></legend><button type="button" data-sample="accept" data-t="accept"></button><button type="button" data-sample="enhance" data-t="enhance"></button><button type="button" data-sample="reject" data-t="rejectCase"></button></fieldset>
<label class="file-label" for="photos" data-t="photos"></label><input id="photos" type="file" accept="image/png,image/jpeg" multiple><p class="muted" data-t="newSelection"></p><div id="originals" class="original-grid"></div>
<label class="rights"><input id="rights" type="checkbox"><span data-t="rights"></span></label><button class="button primary" id="run" type="button" data-t="run"></button>
<p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
<section id="result" hidden><h3 id="decision" tabindex="-1"></h3><div id="details"></div><h3 data-t="trace"></h3><ol id="trace" class="trace"></ol><fieldset id="review"><legend data-t="review"></legend><button id="approveOriginal" data-choice="ORIGINAL" data-t="approveOriginal"></button><button id="approveProposal" data-choice="PROPOSAL" data-t="approveProposal"></button><button id="decline" data-choice="REJECT" data-t="decline"></button><button id="request" data-choice="REQUEST_NEW_PHOTO" data-t="request"></button></fieldset><p data-t="privacy"></p></section>
</section></section></main><script type="module" src="src/ui.mjs"></script></body></html>
